plugins {
    id "com.android.library"
}

android {
    namespace "com.sonu4y.mikulive"
    compileSdk 34
    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Provided by the Godot app at runtime; only needed to compile the plugin.
    compileOnly "org.godotengine:godot:4.4.1.stable"
    // On-device voice engine (sherpa-onnx). The full AAR ships next to this plugin in addons/.
    compileOnly files("libs/sherpa-onnx-classes.jar")
}
