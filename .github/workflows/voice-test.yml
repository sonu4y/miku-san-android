name: Voice test on an Android emulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1

jobs:
  emulator-test:
    # a phone release is made on manual runs or when the commit message says [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Get her on-device voice (Kokoro via sherpa-onnx)
        run: |
          SV=1.12.40
          curl -sSL --retry 5 -o sherpa.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SV}/sherpa-onnx-${SV}.aar"
          mkdir -p android-plugin/miku-live/libs
          unzip -p sherpa.aar classes.jar > android-plugin/miku-live/libs/sherpa-onnx-classes.jar
          # only phone chips (arm); drop the emulator (x86) libraries and the unused C/C++ API libs
          zip -q -d sherpa.aar 'jni/x86/*' 'jni/*/libsherpa-onnx-c-api.so' 'jni/*/libsherpa-onnx-cxx-api.so' || true
          cp sherpa.aar addons/sherpa-onnx.aar
          unzip -l addons/sherpa-onnx.aar
          curl -sSL --retry 5 -o kokoro.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2"
          tar xjf kokoro.tar.bz2
          S=kokoro-int8-multi-lang-v1_0
          A=android-plugin/miku-live/src/main/assets/kokoro
          mkdir -p "$A/espeak-ng-data"
          cp $S/model.int8.onnx $S/voices.bin $S/tokens.txt $S/lexicon-us-en.txt $S/LICENSE "$A/"
          (cd $S/espeak-ng-data && cp -r phondata phondata-manifest phonindex phontab intonations en_dict lang voices "$GITHUB_WORKSPACE/$A/espeak-ng-data/")
          rm -rf $S kokoro.tar.bz2 sherpa.aar
          du -sh "$A"
          # her fast voice (Piper, many speakers): makes speech much faster than real time
          curl -sSL --retry 5 -o fast.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-libritts_r-medium.tar.bz2"
          tar xjf fast.tar.bz2
          F=vits-piper-en_US-libritts_r-medium
          B=android-plugin/miku-live/src/main/assets/voice-fast
          mkdir -p "$B/espeak-ng-data"
          cp $F/en_US-libritts_r-medium.onnx "$B/model.onnx"
          cp $F/tokens.txt $F/MODEL_CARD "$B/"
          (cd $F/espeak-ng-data && cp -r phondata phondata-manifest phonindex phontab intonations en_dict lang voices "$GITHUB_WORKSPACE/$B/espeak-ng-data/")
          rm -rf $F fast.tar.bz2
          du -sh "$B"

      - name: Build the live-mode plugin (native Android service)
        run: |
          cd android-plugin
          gradle --no-daemon :miku-live:assembleRelease
          cp miku-live/build/outputs/aar/miku-live-release.aar ../addons/miku-live.aar
          ls -la ../addons/miku-live.aar

      - name: Download Godot and Android export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/android_source.zip" "templates/version.txt" -d "$T"
          rm templates.tpz godot.zip

      - name: Point Godot at the Android SDK and signing key
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/android/miku-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Import assets (including her VRM model)
        run: |
          ./godot --headless --editor --quit || true
          ./godot --headless --import || true

      - name: Install the Android (Gradle) build template
        run: |
          ./godot --headless --install-android-build-template --quit || true
          test -d android/build || (mkdir -p android/build && unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build && echo "${GODOT_VERSION}.stable" > android/.build_version)
          ls android/build | head
          grep -n "addons" android/build/build.gradle || true

      - name: Also build for the emulator's chip (x86_64)
        run: sed -i 's/architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg

      - name: Export APK (release, signed with the same key every build)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/miku-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/miku-debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          ./godot --headless --export-release "Android" build/miku-san.apk
          ls -la build
          test -s build/miku-san.apk

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          rm -rf android/build/build "$HOME/.local/share/godot/export_templates" || true
          df -h /

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the voice self-test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 3000M
          cores: 3
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/selftest.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: logcat.txt
